services:
  - type: web
    name: pichat-free-online
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pichat-db
          property: connectionString
      - key: PICHAT_SECRET_KEY
        generateValue: true
      - key: PICHAT_STORAGE_BACKEND
        value: database
      - key: PICHAT_COOKIE_SECURE
        value: "1"
      - key: PICHAT_INTERNET_MODE
        value: "1"
      - key: PICHAT_TRUST_PROXY
        value: "1"
      - key: PICHAT_SETUP_MODE
        value: "1"
      - key: PICHAT_REGISTRATION_MODE
        value: approval

databases:
  - name: pichat-db
    plan: free
    databaseName: pichat
    user: pichat
