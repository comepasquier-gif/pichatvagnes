<!DOCTYPE html>
<html lang="fr">
<head><script src="/js/cache_guard363.js?v=3630"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07112b">
  <title>Inscription · PiChat 3.5</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/pichat-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/pichat-192.png">
  <link rel="stylesheet" href="/css/login.css?v=3630">
  <link rel="stylesheet" href="/css/pwa.css?v=3630">
  <link rel="stylesheet" href="/css/brand35.css?v=3630">
</head>
<body class="d104-auth">
  <main class="auth-layout">
    <section class="auth-visual" aria-label="Présentation PiChat">
      <div class="visual-content">
        <div>
          <h2>Rejoins<br>ta communauté.</h2>
          <p>Une interface moderne, mobile et sécurisée pour discuter, jouer, apprendre et retrouver tes amis.</p>
          <div class="feature-row">
            <span class="feature">💬 Temps réel</span>
            <span class="feature">👥 Amis & MP</span>
            <span class="feature">🎓 PiTutor</span>
            <span class="feature">🪙 PyCoins</span>
          </div>
        </div>
      </div>
    </section>
    <section class="auth-side">
      <div class="auth-card">
        <h1>Demander mon accès ✨</h1>
        <p class="subtitle">Choisis ton pseudo et ta classe. Un admin validera ensuite ton accès.</p>
        <div id="error-message" class="error-message" role="alert"></div>
        <div id="success-message" class="success-message" role="status"></div>
        <form id="register-form">
          <div class="form-group"><label for="username">Pseudo</label><input type="text" id="username" required minlength="3" maxlength="32" autocomplete="username" placeholder="Ex. Nathan"></div>
          <div class="form-group"><label for="class-code">Classe</label><input type="text" id="class-code" required maxlength="12" placeholder="Ex. 5C ou 6C" autocomplete="off"></div>
          <div class="form-group"><label for="password">Mot de passe</label><input type="password" id="password" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="8 caractères minimum"></div>
          <div class="form-group"><label for="password-confirm">Confirmer le mot de passe</label><input type="password" id="password-confirm" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="Répète le mot de passe"></div>
          <button type="submit" class="submit-button" id="submit-button">Envoyer ma demande</button>
        </form>
        <p class="switch-link">Déjà un compte ? <a href="/login">Se connecter</a></p>
      </div>
    </section>
  </main>
  <script src="/js/auth.js?v=3630"></script>
  <script src="/js/pwa.js?v=3630"></script>
  <script src="/js/brand35.js?v=3630"></script>
  <script src="/js/performance35.js?v=3630"></script>
</body>
</html>
