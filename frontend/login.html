<style data-pichat-auth-critical>
:root{--bg:#07111f;--surface:#0e1a31;--surface2:#172947;--line:rgba(155,183,225,.16);--text:#f5f8ff;--muted:#8fa3c3;--brand:#7c5cff;--brand2:#37b5ff;--good:#31d59b;--bad:#ff6474}
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;padding:24px;font-family:Inter,"Segoe UI Variable","Segoe UI",sans-serif;background:radial-gradient(circle at 8% 0%,rgba(124,92,255,.34),transparent 34%),radial-gradient(circle at 100% 0%,rgba(55,181,255,.22),transparent 30%),linear-gradient(145deg,#06101e,#0b1730 50%,#070d18);color:var(--text);display:grid;place-items:center}
.auth-layout{width:min(980px,100%);min-height:590px;display:grid;grid-template-columns:1.05fr .95fr;border:1px solid var(--line);border-radius:30px;overflow:hidden;background:rgba(10,22,42,.88);box-shadow:0 35px 100px rgba(0,0,0,.45);backdrop-filter:blur(20px)}.auth-visual{position:relative;padding:44px;overflow:hidden;background:linear-gradient(145deg,rgba(124,92,255,.22),rgba(55,181,255,.08)),#101e38}.auth-visual:before{content:"";position:absolute;width:360px;height:360px;border-radius:50%;background:linear-gradient(135deg,#7c5cff,#37b5ff);filter:blur(1px);opacity:.18;right:-160px;top:-120px}.auth-visual:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(135deg,#000,transparent 75%)}.visual-content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}.mini-logo{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#37b5ff);font-weight:950;font-size:1.25rem;box-shadow:0 12px 35px rgba(79,104,255,.32)}.auth-visual h2{font-size:2.55rem;line-height:1.03;letter-spacing:-.06em;margin:auto 0 12px;max-width:420px}.auth-visual p{color:#a9b9d2;max-width:410px}.feature-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.feature{border:1px solid rgba(176,201,239,.14);background:rgba(6,16,31,.30);border-radius:999px;padding:.45rem .7rem;color:#c8d6e9;font-size:.76rem}
.auth-side{padding:46px 42px;display:flex;align-items:center}.auth-card{width:100%;max-width:390px;margin:auto}.auth-card .mobile-logo{display:none}.auth-card h1{margin:0;font-size:2rem;letter-spacing:-.045em}.subtitle{margin:.45rem 0 1.65rem;color:var(--muted);line-height:1.5}.form-group{display:grid;gap:.48rem;margin:1rem 0}.form-group label{font-size:.78rem;color:#c4d1e4;font-weight:750}.form-group input{width:100%;border:1px solid var(--line);border-radius:14px;background:#09162b;color:white;padding:.88rem .95rem;outline:none;transition:.15s}.form-group input:focus{border-color:rgba(55,181,255,.62);box-shadow:0 0 0 4px rgba(55,181,255,.09);background:#0b1a32}.submit-button{width:100%;border:0;border-radius:14px;padding:.9rem 1rem;background:linear-gradient(135deg,var(--brand),var(--brand2));color:white;font-weight:850;margin-top:.8rem;box-shadow:0 12px 30px rgba(71,113,255,.26);transition:.15s}.submit-button:hover{transform:translateY(-1px);filter:brightness(1.08)}.submit-button:disabled{opacity:.58;transform:none}.switch-link{text-align:center;color:var(--muted);font-size:.86rem;margin:1.25rem 0 0}.switch-link a{color:#9fd3ff;font-weight:750;text-decoration:none}.error-message,.success-message{display:none;padding:.75rem .82rem;border-radius:12px;margin:.85rem 0;font-size:.83rem}.error-message.visible{display:block;background:rgba(255,100,116,.10);border:1px solid rgba(255,100,116,.34);color:#ffabb4}.success-message.visible{display:block;background:rgba(49,213,155,.10);border:1px solid rgba(49,213,155,.32);color:#8aebc7}
